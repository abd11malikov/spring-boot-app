# Gym platform container environment: Gym CRM with its PostgreSQL database, the Trainer Workload service
# and the Eureka discovery server, on one user-defined network.
#
# Credentials and keys are NOT stored here: Compose reads them from the environment or from a `.env` file
# next to this file (copy .env.example to .env). Startup fails with a clear message if one is missing.
#
# Addressing:
#   - infrastructure level: containers reach each other by Compose service name (db, discovery-server),
#     resolved by Docker's DNS on gym-net;
#   - application level: Gym CRM finds the workload service by its Eureka name (trainer-workload-service).
#   No container IP address is configured anywhere.
name: gym-crm

# Shared health check timing for the Spring Boot services; each service sets its own `test`.
x-spring-healthcheck: &spring-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s

x-eureka-url: &eureka-url http://discovery-server:8761/eureka/

services:
  db:
    image: postgres:17-alpine
    container_name: gym-crm-db
    environment:
      POSTGRES_DB: ${DB_NAME:-gym_crm}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set (see .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gym-net
    restart: unless-stopped

  discovery-server:
    build: ./discovery-server
    image: gym-discovery-server:1.0
    container_name: gym-discovery-server
    environment:
      EUREKA_HOSTNAME: discovery-server
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8761/actuator/health || exit 1"]
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - gym-net
    restart: unless-stopped

  trainer-workload-service:
    build: ./trainer-workload-service
    image: gym-trainer-workload-service:1.0
    container_name: gym-trainer-workload-service
    # Waits until Eureka answers its health check, not merely until its container has started
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: *eureka-url
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET must be set (see .env.example)}
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8081/actuator/health || exit 1"]
    ports:
      - "${WORKLOAD_PORT:-8081}:8081"
    networks:
      - gym-net
    restart: unless-stopped

  gym-crm:
    build: ./gym-crm
    image: gym-crm:1.0
    container_name: gym-crm-app
    # Not tied to the workload service: Gym CRM starts without it and answers 503 (through timeouts and the
    # circuit breaker) for the operations that need it while it is unavailable
    depends_on:
      db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gym_crm}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set (see .env.example)}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET must be set (see .env.example)}
      EUREKA_URL: *eureka-url
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/actuator/health || exit 1"]
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - gym-net
    restart: unless-stopped

networks:
  gym-net:
    name: gym-net

volumes:
  db-data:
    name: gym-crm-db-data
