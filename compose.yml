# Gym platform container environment: Gym CRM with its PostgreSQL database, the Trainer Workload service with
# its MongoDB database, the ActiveMQ broker between them and the Eureka discovery server, on one user-defined
# network.
#
# Credentials and keys are NOT stored here: Compose reads them from the environment or from a `.env` file
# next to this file (copy .env.example to .env). Startup fails with a clear message if one is missing.
#
# Addressing:
#   - containers reach each other by Compose service name (db, mongodb, activemq, discovery-server), resolved by
#     Docker's DNS on gym-net; Gym CRM and Trainer Workload talk only through the trainer.workload queue;
#   - both services register with Eureka under their names.
#   No container IP address is configured anywhere.
name: gym-crm

# Shared health check timing for the Spring Boot services; each service sets its own `test`.
x-spring-healthcheck: &spring-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s

x-eureka-url: &eureka-url http://discovery-server:8761/eureka/
# Fails fast (3 s) instead of hanging when the broker is down
x-activemq-url: &activemq-url tcp://activemq:61616?connectionTimeout=3000

services:
  db:
    image: postgres:17-alpine
    container_name: gym-crm-db
    environment:
      POSTGRES_DB: ${DB_NAME:-gym_crm}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set (see .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gym-net
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: gym-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME must be set (see .env.example)}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set (see .env.example)}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Not published on the host: inspect it with `docker exec -it gym-mongodb mongosh -u <user> -p`
    networks:
      - gym-net
    restart: unless-stopped

  activemq:
    image: apache/activemq-classic:6.1.8
    container_name: gym-activemq
    environment:
      # The image turns on broker authentication when a connection user is set
      ACTIVEMQ_CONNECTION_USER: ${ACTIVEMQ_USER:?ACTIVEMQ_USER must be set (see .env.example)}
      ACTIVEMQ_CONNECTION_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD must be set (see .env.example)}
      # Web console login: admin / ACTIVEMQ_PASSWORD. The user stays "admin" because the image renames the
      # console user but not its admin group membership.
      ACTIVEMQ_WEB_USER: admin
      ACTIVEMQ_WEB_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD must be set (see .env.example)}
    volumes:
      # Persistent messages survive a broker restart
      - activemq-data:/opt/apache-activemq/data
    healthcheck:
      # Healthy once the OpenWire port accepts connections
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/61616' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      # Web console (queues, dead letters): http://localhost:8161/admin
      - "${ACTIVEMQ_CONSOLE_PORT:-8161}:8161"
    networks:
      - gym-net
    restart: unless-stopped

  discovery-server:
    build: ./discovery-server
    image: gym-discovery-server:1.0
    container_name: gym-discovery-server
    environment:
      EUREKA_HOSTNAME: discovery-server
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8761/actuator/health || exit 1"]
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - gym-net
    restart: unless-stopped

  trainer-workload-service:
    build: ./trainer-workload-service
    image: gym-trainer-workload-service:1.0
    container_name: gym-trainer-workload-service
    # Waits until Eureka, the broker and MongoDB answer their health checks, not merely until their containers started
    depends_on:
      discovery-server:
        condition: service_healthy
      activemq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME must be set (see .env.example)}:${MONGO_PASSWORD:?MONGO_PASSWORD must be set (see .env.example)}@mongodb:27017/trainer_workload?authSource=admin
      EUREKA_URL: *eureka-url
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET must be set (see .env.example)}
      ACTIVEMQ_URL: *activemq-url
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?ACTIVEMQ_USER must be set (see .env.example)}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD must be set (see .env.example)}
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8081/actuator/health || exit 1"]
    ports:
      - "${WORKLOAD_PORT:-8081}:8081"
    networks:
      - gym-net
    restart: unless-stopped

  gym-crm:
    build: ./gym-crm
    image: gym-crm:1.0
    container_name: gym-crm-app
    # Not tied to the workload service: messages wait in the queue while it is down
    depends_on:
      db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      activemq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gym_crm}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set (see .env.example)}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET must be set (see .env.example)}
      EUREKA_URL: *eureka-url
      ACTIVEMQ_URL: *activemq-url
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:?ACTIVEMQ_USER must be set (see .env.example)}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:?ACTIVEMQ_PASSWORD must be set (see .env.example)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/actuator/health || exit 1"]
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - gym-net
    restart: unless-stopped

networks:
  gym-net:
    name: gym-net

volumes:
  db-data:
    name: gym-crm-db-data
  activemq-data:
    name: gym-activemq-data
  mongo-data:
    name: gym-mongo-data
