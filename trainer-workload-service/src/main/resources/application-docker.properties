# Containerized environment: the registry address and the service token key come only from the
# environment (no defaults on purpose). EUREKA_URL uses the Compose service name, e.g.
# http://discovery-server:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_URL}
workload.security.jwt.secret=${SERVICE_JWT_SECRET}

logging.level.com.epam.trainerworkload=INFO
