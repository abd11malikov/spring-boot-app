# Containerized environment: broker, registry and token key come only from the environment (no defaults on
# purpose). Hosts are Compose service names, e.g. ACTIVEMQ_URL=tcp://activemq:61616 and
# EUREKA_URL=http://discovery-server:8761/eureka/
spring.activemq.broker-url=${ACTIVEMQ_URL}
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD}
eureka.client.service-url.defaultZone=${EUREKA_URL}
workload.security.jwt.secret=${SERVICE_JWT_SECRET}
workload.messaging.concurrency=2-5
logging.level.com.epam.trainerworkload=INFO
