# Production: broker, registry and token key only from the environment (no defaults on purpose)
spring.activemq.broker-url=${ACTIVEMQ_URL}
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD}
eureka.client.service-url.defaultZone=${EUREKA_URL}
workload.security.jwt.secret=${SERVICE_JWT_SECRET}
workload.messaging.concurrency=5-20
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoint.health.show-details=never
logging.level.com.epam.trainerworkload=INFO
