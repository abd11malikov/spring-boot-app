# Shared development environment: settings overridable by environment variables
spring.activemq.broker-url=${ACTIVEMQ_URL:tcp://localhost:61616?connectionTimeout=3000}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
workload.messaging.concurrency=2-5
logging.level.com.epam.trainerworkload=DEBUG
