spring.application.name=trainer-workload-service
server.port=${SERVER_PORT:8081}
spring.profiles.default=local

workload.rest-logging.max-body-length=2000

# Service JWT check: tokens are signed by Gym CRM with this shared Base64 key (>= 256 bits).
# The default is for local development only; the docker profile requires SERVICE_JWT_SECRET.
workload.security.jwt.secret=${SERVICE_JWT_SECRET:ZGV2LW9ubHktZ3ltLXNlcnZpY2UtdG8tc2VydmljZS1qd3Qta2V5LTI1Ng==}
workload.security.jwt.issuer=gym-crm
workload.security.jwt.audience=${spring.application.name}

# Eureka client: registers as "trainer-workload-service" so Gym CRM can find it by name
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
eureka.client.healthcheck.enabled=true
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.instance-info-replication-interval-seconds=10

# Trainer workload messages from Gym CRM. Invalid messages, and ones that keep failing, go to the dead letter
# queue. Each profile sets the broker and how many consumers run (min-max, scaled with the load).
workload.messaging.queue=trainer.workload
workload.messaging.dead-letter-queue=DLQ.trainer.workload
workload.messaging.concurrency=2-5
workload.messaging.max-delivery-attempts=4
workload.messaging.redelivery-delay=1s
spring.jms.cache.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.description=Monthly training workload of each trainer

logging.level.com.epam.trainerworkload=INFO
