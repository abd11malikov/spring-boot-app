spring.application.name=discovery-server
server.port=${SERVER_PORT:8761}

# A standalone registry: it does not register with itself or copy the registry from peers
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/
# Single-node setup: self-preservation would keep stopped instances listed for a long time
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000
# Let registrations be visible to clients right away instead of after the 30 s cache refresh
eureka.server.response-cache-update-interval-ms=5000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.description=Eureka discovery server of the gym platform

logging.level.com.epam=INFO
