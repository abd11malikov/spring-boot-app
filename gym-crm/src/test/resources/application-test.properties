spring.datasource.url=jdbc:h2:mem:gym_crm_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

management.metrics.tags.environment=test

# Tests run without Eureka, with an embedded in-memory broker, and, unless a test turns it on, without
# publishing workload messages
eureka.client.enabled=false
spring.activemq.broker-url=vm://embedded?broker.persistent=false&broker.useJmx=false
gym.workload.enabled=false
