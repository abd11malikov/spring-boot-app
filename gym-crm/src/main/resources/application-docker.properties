# Containerized environment: database settings come only from the environment variables passed at
# container startup (no defaults on purpose). The host in DB_URL is the database container / Compose
# service name, e.g. jdbc:postgresql://db:5432/gym_crm
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000

# Logs go to standard output only (see logback-spring.xml), so `docker logs` shows everything
logging.level.com.epam.gym=INFO

management.metrics.tags.environment=docker

# No default signing keys or registry address outside development (see RequiredPropertiesInitializer)
gym.security.jwt.secret=${JWT_SECRET}
gym.workload.jwt.secret=${SERVICE_JWT_SECRET}
eureka.client.service-url.defaultZone=${EUREKA_URL}
