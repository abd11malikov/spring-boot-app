# Production: database settings come only from the environment (no defaults on purpose)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=5000

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.com.epam.gym=INFO
logging.level.org.hibernate.SQL=WARN

management.metrics.tags.environment=prod
management.endpoint.health.show-details=never

# No default signing keys or registry address outside development (see RequiredPropertiesInitializer)
gym.security.jwt.secret=${JWT_SECRET}
gym.workload.jwt.secret=${SERVICE_JWT_SECRET}
eureka.client.service-url.defaultZone=${EUREKA_URL}

# Broker settings only from the environment (no defaults on purpose)
spring.activemq.broker-url=${ACTIVEMQ_URL}
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD}
