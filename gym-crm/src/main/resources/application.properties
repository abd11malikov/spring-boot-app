spring.application.name=gym-crm
spring.profiles.default=local

server.port=8080

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

gym.password.length=10
gym.password.characters=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789
gym.rest-logging.max-body-length=2000

# Security. The JWT secret is a Base64 encoded key of at least 256 bits (e.g. `openssl rand -base64 32`).
# The default below is for local development only; stg, prod and docker require JWT_SECRET.
gym.security.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktZ3ltLWNybS1qd3Qtc2VjcmV0LWtleS0yNTYtYml0cw==}
gym.security.jwt.expiration=PT1H
gym.security.brute-force.max-attempts=3
gym.security.brute-force.block-duration=PT5M
gym.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
gym.security.cors.max-age=PT1H

logging.level.com.epam.gym=INFO

management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.tags.application=${spring.application.name}
management.info.java.enabled=true
management.info.env.enabled=true
info.app.description=Gym CRM REST API

gym.health.memory.max-heap-usage=0.9

# Eureka client: registers as "gym-crm"
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
eureka.client.healthcheck.enabled=true
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.instance-info-replication-interval-seconds=10

# ActiveMQ connection. Each profile sets the broker; the connection is cached and fails fast when the broker
# is down (connectionTimeout in the broker URL), instead of retrying forever.
spring.jms.cache.enabled=true
spring.jms.cache.session-cache-size=10
# Messages are sent in a transacted session that Spring commits only after the database transaction commits
spring.jms.template.session.transacted=true
spring.jms.template.delivery-mode=persistent
spring.jms.template.qos-enabled=true

# Trainer Workload integration: messages on this queue; set enabled=false to run Gym CRM on its own
gym.workload.enabled=true
gym.workload.queue=trainer.workload
# Service-to-service JWT sent with every message, signed with its own key shared only with the workload service.
# The default is for local development only; stg, prod and docker require SERVICE_JWT_SECRET.
gym.workload.jwt.secret=${SERVICE_JWT_SECRET:ZGV2LW9ubHktZ3ltLXNlcnZpY2UtdG8tc2VydmljZS1qd3Qta2V5LTI1Ng==}
gym.workload.jwt.audience=trainer-workload-service
gym.workload.jwt.expiration=PT5M

# Circuit breaker around sending to the broker: opens when half of the last 10 sends (at least 5) failed or took
# longer than 2 s, rejects sends for 30 s, then lets 3 trial sends through
resilience4j.circuitbreaker.instances.trainerWorkload.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.trainerWorkload.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainerWorkload.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainerWorkload.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainerWorkload.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.trainerWorkload.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.trainerWorkload.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.trainerWorkload.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.trainerWorkload.slow-call-rate-threshold=100
