# Developer machine: local PostgreSQL, verbose logging, all docs enabled
spring.datasource.url=jdbc:postgresql://localhost:5432/gym_crm
spring.datasource.username=gym_user
spring.datasource.password=gym_pass
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.properties.hibernate.format_sql=true
logging.level.com.epam.gym=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.metrics.tags.environment=local

# Local ActiveMQ (docker run -p 61616:61616 apache/activemq-classic), default credentials
spring.activemq.broker-url=tcp://localhost:61616?connectionTimeout=3000
spring.activemq.user=admin
spring.activemq.password=admin
