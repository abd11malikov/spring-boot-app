# Staging: database settings come only from the environment (no defaults on purpose)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=10000

logging.level.com.epam.gym=INFO

management.metrics.tags.environment=stg

# No default JWT signing key outside development (see RequiredDatabasePropertiesInitializer)
gym.security.jwt.secret=${JWT_SECRET}
