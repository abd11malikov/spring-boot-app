# Shared development environment: its own database, credentials overridable by environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gym_crm_dev}
spring.datasource.username=${DB_USERNAME:gym_user}
spring.datasource.password=${DB_PASSWORD:gym_pass}
spring.datasource.hikari.maximum-pool-size=10

logging.level.com.epam.gym=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.metrics.tags.environment=dev
